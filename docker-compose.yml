services:

  flask:
    build: .
    ports:
      - "5001:5000"

    environment:
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DB_USER: root
      DB_PASSWORD: root123
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: p1_social_media

    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: p1_social_media

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: