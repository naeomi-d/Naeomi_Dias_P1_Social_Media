{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1 class="text-center">
            Welcome Back
        </h1>

        <p class="text-center text-muted mb-4">
            Login to your Postly account
        </p>

        <form method="POST">

            <div class="mb-3">

                <label
                    for="username"
                    class="form-label"
                >
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-control"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="mb-4">

                <label
                    for="password"
                    class="form-label"
                >
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-dark w-100"
            >
                Login
            </button>

        </form>

        <p class="text-center text-muted mt-4 mb-0">

            Don't have an account?

            <a href="{{ url_for('auth.register') }}">
                Register
            </a>

        </p>

    </div>

</div>

{% endblock %}
