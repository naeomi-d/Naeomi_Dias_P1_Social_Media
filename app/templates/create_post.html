{% extends "base.html" %}

{% block title %}
Create Post
{% endblock %}

{% block content %}

<div class="page-container narrow-container">

    <div class="page-header">

        <h1>Create Post</h1>

        <p>
            Share something with your community.
        </p>

    </div>


    <div class="form-card">

        <form
            method="POST"
            enctype="multipart/form-data"
        >
            <div class="form-group">

                <label for="content">
                    What's on your mind?
                </label>

                <textarea
                    id="content"
                    name="content"
                    rows="7"
                    placeholder="Write something..."
                    required
                ></textarea>

            </div>


            <div class="form-group">

                <label for="image">
                    Post Image
                    <span class="optional-label">
                        Optional
                    </span>
                </label>

                <input
                    type="file"
                    id="image"
                    name="image"
                    accept="image/jpeg,image/png,image/gif"
                    class="file-input"
                >

                <small class="form-help">
                    JPG, JPEG, PNG or GIF. Maximum size: 5 MB.
                </small>

            </div>

            <div class="form-group">

                <label for="visibility">
                    Visibility
                </label>

                <select
                    id="visibility"
                    name="visibility"
                >

                    <option value="PUBLIC">
                        Public — Everyone can see this
                    </option>

                    <option value="FOLLOWERS">
                        Followers — Only your followers
                    </option>

                    <option value="PRIVATE">
                        Private — Only you
                    </option>

                </select>

            </div>

            <div class="form-actions">

                <a
                    href="{{ url_for('home.home') }}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Create Post
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
