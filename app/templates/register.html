{% extends "base.html" %}

{% block title %}
Register
{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1 class="text-center">
            Create Account
        </h1>

        <p class="text-center text-muted mb-4">
            Join Postly and start sharing your thoughts with the world.
        </p>


        <form method="POST">

            <div class="mb-3">

                <label
                    for="username"
                    class="form-label"
                >
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-control"
                    placeholder="Choose a username"
                >

            </div>


            <div class="mb-3">

                <label
                    for="email"
                    class="form-label"
                >
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="you@example.com"
                >

            </div>


            <div class="row">

                <div class="col-md-6 mb-3">

                    <label
                        for="first_name"
                        class="form-label"
                    >
                        First Name
                    </label>

                    <input
                        type="text"
                        id="first_name"
                        name="first_name"
                        class="form-control"
                        placeholder="First name"
                    >

                </div>


                <div class="col-md-6 mb-3">

                    <label
                        for="last_name"
                        class="form-label"
                    >
                        Last Name
                    </label>

                    <input
                        type="text"
                        id="last_name"
                        name="last_name"
                        class="form-control"
                        placeholder="Last name"
                    >

                </div>

            </div>


            <div class="mb-4">

                <label
                    for="password"
                    class="form-label"
                >
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Create a password"
                >

            </div>


            <button
                type="submit"
                class="btn btn-dark w-100"
            >
                Create Account
            </button>

        </form>


        <p class="text-center text-muted mt-4 mb-0">

            Already have an account?

            <a href="{{ url_for('auth.login') }}">
                Login
            </a>

        </p>

    </div>

</div>

{% endblock %}
